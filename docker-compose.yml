# Démarrage : cp .env.example .env && docker compose up --build -d
# Ollama est optionnel (profil "ollama") ; aucun modèle n'est téléchargé pendant le build.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args: { INSTALL_AI: "${INSTALL_AI:-false}" }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      UPLOAD_DIR: /data/uploads
      SECURITY_REPORT_PATH: /reports/security_report.json
      HF_HOME: /models/hf
    volumes: [uploads:/data/uploads, models:/models, ./docs/security:/reports:ro, ./ml/models:/app/ml_models:ro]
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on: { backend: { condition: service_healthy } }
    ports: ["5173:80"]

  mlflow:
    build: { context: ., dockerfile: docker/mlflow.Dockerfile }
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      --default-artifact-root /mlflow/artifacts
    volumes: [mlflow:/mlflow/artifacts]
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:5000:5000"]

  # Serveur MCP en transport HTTP : l'identité vient de l'en-tête Authorization: Bearer <JWT> de chaque requête.
  mcp:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      HF_HOME: /models/hf
    command: ["python", "-m", "app.mcp.server"]
    volumes: [models:/models]
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:8765:8765"]

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    ports: ["127.0.0.1:11434:11434"]

volumes:
  pgdata:
  uploads:
  models:
  mlflow:
  ollama:
